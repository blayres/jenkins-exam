apiVersion: v1
kind: Service
metadata:
  name: {{ include "jenkins-exam.fullname" . }}-movie-db
  labels:
    {{- include "jenkins-exam.labels" . | nindent 4 }}
    app: movie-db
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.movieDb.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: movie-db
    release: {{ .Release.Name }}
