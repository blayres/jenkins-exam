apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jenkins-exam.fullname" . }}-nginx-config
  labels:
    {{- include "jenkins-exam.labels" . | nindent 4 }}
data:
  nginx.conf: |
    events {}

    http {
      resolver 10.43.0.10 valid=10s ipv6=off;

      server {
        listen 8080;

        location /api/v1/movies {
          set $movie_upstream http://{{ include "jenkins-exam.fullname" . }}-movie.{{ .Release.Namespace }}.svc.cluster.local:8000;
          proxy_pass $movie_upstream;
        }

        location /api/v1/casts {
          set $cast_upstream http://{{ include "jenkins-exam.fullname" . }}-cast.{{ .Release.Namespace }}.svc.cluster.local:8000;
          proxy_pass $cast_upstream;
        }
      }
    }
